<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salary Calculator - Milano</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
    .result-box {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 15px;
        margin-top: 15px;
        background: #f9f9f9;
    }
</style>
</head>
<body class="container py-4">

<h3>Milano Net Salary Calculator</h3>

<form id="salaryForm" class="mt-3" style="max-width:450px;">
    <div class="mb-3">
        <label class="form-label">Annual Gross Income (€)</label>
        <input type="number" min="0" step="100" class="form-control" id="grossInput" placeholder="e.g., 40000" required value="60000">
    </div>

    <button type="submit" class="btn btn-primary">Calculate</button>
</form>

<div class="divider pb-3 border-bottom mb-3"></div>

<div id="result"></div>


<script>
/**
 * Calculate Net Salary Milano (JS version of your PHP)
 */
function calculateMilano(grossAnnual) 
{
    // rates
	const inpsRate = '9.19%';
	let irpefRate = "23%";
    if (grossAnnual > 75000) irpefRate = "23% / 35% / 37% / 43%";
    else if (grossAnnual > 50000) irpefRate = "23% / 35% / 37%";
    else if (grossAnnual > 28000) irpefRate = "23% / 35%";
	const regionalTaxRate = '1.73%';
	const municipalTaxRate = '0.8%';

    // 1. INPS
    const inps = grossAnnual * 0.0919;

    // 2. IRPEF
    let irpef = 0;
    if (grossAnnual <= 28000) {
        irpef = grossAnnual * 0.23;
    } else if (grossAnnual <= 50000) {
        irpef = 28000 * 0.23 + (grossAnnual - 28000) * 0.35;
    } else if (grossAnnual <= 75000) {
        irpef = 28000 * 0.23 + 22000 * 0.35 + (grossAnnual - 50000) * 0.37;
    } else {
        irpef = 28000 * 0.23 + 22000 * 0.35 + 25000 * 0.37 + (grossAnnual - 75000) * 0.43;
    }

    // 3. Deduction (detrazione)
    let deduction = 0;
    if (grossAnnual <= 15000) {
        deduction = 1880;
    } else if (grossAnnual <= 28000) {
        deduction = 1910 + 1190 * (28000 - grossAnnual) / 13000;
    } else if (grossAnnual <= 50000) {
        deduction = 1910 * (50000 - grossAnnual) / 22000;
    }

    irpef = Math.max(0, irpef - deduction);

    // 4. Regional tax Lombardia
    const regionalTax = grossAnnual * 0.0173;

    // 5. Municipal tax Milano
    const municipalTax = grossAnnual * 0.008;

    // Totals
    const totalDeductions = inps + irpef + regionalTax + municipalTax;
    const netAnnual = grossAnnual - totalDeductions;

    return {
        country: "Italia (Milano)",
        currency: "EUR",
        grossAnnual,
        grossMonthly: grossAnnual / 12,
        netAnnual,
        netMonthly: netAnnual / 12,
        totalDeductions,
        totalMonthlyDeductions: totalDeductions / 12,
        effectiveRate: (totalDeductions / grossAnnual) * 100,
        deduction,
        irpefRate,
        deductions: [
            { name: "INPS", amount: inps, rate: inpsRate },
            { name: "IRPEF", amount: irpef, rate: irpefRate },
            { name: "Regional (Lombardia)", amount: regionalTax, rate: regionalTaxRate },
            { name: "Municipal (Milano)", amount: municipalTax, rate: municipalTaxRate }
        ]
    };
}

/**
 * Currency formatter
 */
function formatEUR(amount) {
    return amount.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
}


/**
 * jQuery submit handler
 */
$("#salaryForm").on("submit", function(e){
    e.preventDefault();

    const gross = parseFloat($("#grossInput").val());
    const result = calculateMilano(gross);

    // Output to UI
    $("#result").html(`
        <h5>Results</h5>
		<table class="table table-bordered table-striped table-hover">
		  <thead class="table-dark">
			<tr>
			  <th scope="col"></th>
			  <th scope="col">Annual</th>
			  <th scope="col">Monthly</th>
			</tr>
		  </thead>
		  <tbody>
			<tr>
			  <th scope="row">Gross</th>
			  <td>${formatEUR(result.grossAnnual)}</td>
			  <td>${formatEUR(result.grossMonthly)}</td>
			</tr>
			<tr>
			  <th scope="row">Deductions</th>
			  <td class="text-danger">-${formatEUR(result.totalDeductions)}</td>
			  <td class="text-danger">-${formatEUR(result.totalMonthlyDeductions)}</td>
			</tr>
			<tr>
			  <th scope="row">Net</th>
			  <td><strong class="text-success">${formatEUR(result.netAnnual)}</strong></td>
			  <td><strong class="text-success">${formatEUR(result.netMonthly)}</strong></td>
			</tr>
		  </tbody>
		</table>
		
		<div class="result-box">
            <div class="d-flex justify-start align-items-start flex-column flex-lg-row">
				<div class="w-100">
					<p><strong>Total Deduction Rate:</strong> ${result.effectiveRate.toFixed(2)}%</p>
					<ul>
						${result.deductions.map(d => `<li>${d.name}: ${d.rate}</li>`).join("")}
					</ul>
				</div>
				<div class="w-100">				
					<p><strong>Total Deduction:</strong> ${formatEUR(result.totalDeductions)}</p>
					<ul>
						${result.deductions.map(d => `<li>${d.name}: ${formatEUR(d.amount)}</li>`).join("")}
					</ul>
				</div>
			</div>
        </div>
    `);

    console.log("JSON Result:", result); // For debugging
});
</script>

</body>
</html>
